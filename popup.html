<!DOCTYPE html>
<html>
<head>
    <title>History Insights</title>
    <style>
        body {
            width: 400px;
            padding: 16px;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9; 
            color: #333;
        }
        .header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #4285f4;
        }
        .input-group {
            margin-bottom: 16px;
        }
        input, select {
            width: 100%;
            margin-bottom: 8px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #3367d6;
        }
        .error {
            color: red;
            padding: 8px;
            background-color: #fff3f3;
            border-radius: 4px;
        }
        .timeline-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .timeline-control select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        #results {
            margin-top: 20px;
        }
        .results-section {
            margin-bottom: 20px;
        }
        .results-section h3 {
            margin-bottom: 10px;
            color: #333;
        }
        .links-list {
            list-style-type: none;
            padding: 0;
        }
        .links-list li {
            margin-bottom: 8px;
            padding: 8px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .links-list a {
            color: #1a73e8;
            text-decoration: none;
        }
        .links-list a:hover {
            text-decoration: underline;
        }
        .summary {
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 4px;
            line-height: 1.5;
        }
        .github-link {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #666;
        }
        .github-link a {
            display: flex;
            align-items: center;
            color: #1a73e8;
            text-decoration: none;
            gap: 6px;
        }
        .github-link a:hover {
            text-decoration: underline;
        }
        .github-icon {
            width: 16px;
            height: 16px;
        }
        label {
            font-size: 14px;
        }
        #customResultCount {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">Recally</div>
    <div class="input-group">
        <label for="apiKey">Gemini API Key:</label>
        <input type="password" id="apiKey" placeholder="Enter your API key">
    </div>
    <div class="input-group">
        <label for="modelSelect">Select Gemini Model:</label>
        <select id="modelSelect">
            <option value="gemini-1.5-flash" selected>Gemini-1.5-flash</option>
            <option value="gemini-1.5-flash-8b">Gemini-1.5-flash-8b</option>
            <option value="gemini-1.5-pro">Gemini-1.5-pro</option>
            <option value="gemini-2.0-flash">Gemini-2.0-flash</option>
        </select>
        <button id="saveApiKey">Save API Key and Model Information</button>
    </div>
    
    <div class="timeline-control">
        <label for="timeRange">Search History:</label>
        <select id="timeRange">
            <option value="1">Last 24 hours</option>
            <option value="7">Last 7 days</option>
            <option value="14">Last 2 weeks</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 3 months</option>
            <option value="180">Last 6 months</option>
            <option value="365">Last 1 year</option>
        </select>
    </div>
    
    <div class="input-group">
        <label for="resultCount">Results Count:</label>
        <select id="resultCount">
            <option value="50">Quick Search (50 results)</option>
            <option value="100" selected>Standard Search (100 results)</option>
            <option value="200">Deep Search (200 results)</option>
            <option value="500">Comprehensive Search (500 results)</option>
            <option value="1000">Extensive Search (1000 results)</option>
            <option value="2000">Intensive Search (2000 results)</option>
            <option value="custom">Custom</option>
        </select>
        <input type="number" id="customResultCount" placeholder="Enter custom results count">
    </div>

    <div class="input-group">
        <label for="queryInput">Search Query:</label>
        <input type="text" id="queryInput" placeholder="What would you like to find?">
        <button id="searchButton">Search History</button>
    </div>

    <div id="results"></div>

    <div class="github-link">
        <a href="https://github.com/Prajwalgn-07/Recally" target="_blank">
            <svg class="github-icon" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            Contribute on GitHub
        </a>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
